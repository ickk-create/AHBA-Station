<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Game | Asia HCBB Baseball Alliance
  </title>

  <meta
    name="description"
    content="Asia HCBB Baseball Alliance Official Game Detail"
  >

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@500;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">

</head>


<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

<header class="site-header">

  <div class="header-inner">

    <!-- BRAND -->
    <a href="./index.html" class="site-brand">

      <img
        src="./E54D2CD1-606D-43CA-8438-216137170723.png"
        class="site-logo"
        alt="Asia HCBB Baseball Alliance"
      >

      <div class="site-brand-text">

        <div class="site-brand-main">
          ASIA HCBB
        </div>

        <div class="site-brand-sub">
          BASEBALL ALLIANCE
        </div>

      </div>

    </a>


    <!-- NAVIGATION -->
    <nav class="main-nav">

      <a
        href="./index.html#games"
        data-i18n="nav.games"
      >
        試合
      </a>

      <a
        href="./index.html#standings"
        data-i18n="nav.standings"
      >
        順位表
      </a>

      <a
        href="./index.html#schedule"
        data-i18n="nav.schedule"
      >
        時間表
      </a>

      <a
        href="./index.html#leagues"
        data-i18n="nav.leagues"
      >
        リーグ
      </a>

      <a
        href="./ahba.html"
        data-i18n="nav.about"
      >
        AHBA紹介
      </a>

    </nav>


    <!-- RIGHT SIDE -->
    <div class="header-right">

      <div class="header-clock">

        <span id="clock">
          --:--:--
        </span>

        <small id="tz">
          JST
        </small>

      </div>


      <div class="header-language">

        <button
          type="button"
          data-lang="ja"
          title="日本語"
        >
          JP
        </button>

        <button
          type="button"
          data-lang="ko"
          title="한국어"
        >
          KR
        </button>

        <button
          type="button"
          data-lang="zh"
          title="中文"
        >
          中文
        </button>

        <button
          type="button"
          data-lang="en"
          title="English"
        >
          EN
        </button>

      </div>

    </div>

  </div>

</header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>


    <!-- ===================================================
         GAME HERO
         =================================================== -->

    <section class="game-hero">

      <div class="game-hero-inner">


        <!-- Back -->

        <a
          href="./index.html#games"
          class="back-link"
          data-i18n="game.back"
        >
          ← 試合一覧へ戻る
        </a>


        <!-- Game Type -->

        <div
          class="game-type"
          id="gameType"
        >
          MATCH
        </div>


        <!-- Eyebrow -->

        <div
          class="eyebrow"
          data-i18n="game.eyebrow"
        >
          GAME DETAILS
        </div>


        <!-- Date -->

        <div
          class="game-date"
          id="gameDate"
        >
          --
        </div>


        <!-- Final Score -->

        <div class="final-score">


          <div
            class="final-team"
            id="homeTeam"
          >
            --
          </div>


          <div class="final-score-number">

            <strong id="homeScore">
              -
            </strong>

            <span>
              –
            </span>

            <strong id="awayScore">
              -
            </strong>

          </div>


          <div
            class="final-team"
            id="awayTeam"
          >
            --
          </div>

        </div>


        <!-- Status -->

        <div
          class="game-status-label"
          id="gameStatus"
        >
          --
        </div>

      </div>

    </section>


    <!-- ===================================================
         SCOREBOARD
         =================================================== -->

    <section class="section">

      <div class="section-header">

        <div>

          <div
            class="eyebrow"
            data-i18n="game.scoreboardEyebrow"
          >
            SCOREBOARD
          </div>

          <h2 data-i18n="game.scoreboard">
            スコアボード
          </h2>

        </div>

      </div>


      <div class="scoreboard-wrap">

        <table
          class="scoreboard"
          id="scoreboard"
        >

          <thead></thead>

          <tbody></tbody>

        </table>

      </div>

    </section>


    <!-- ===================================================
         PITCHING / HOME RUNS
         =================================================== -->

    <section class="section">

      <div class="detail-grid">


        <!-- Pitching -->

        <div class="detail-card">

          <div
            class="eyebrow"
            data-i18n="game.pitchingEyebrow"
          >
            PITCHING
          </div>

          <h2 data-i18n="game.pitching">
            投手成績
          </h2>


          <div
            id="pitchingResults"
            class="result-list"
          ></div>

        </div>


        <!-- Home Runs -->

        <div class="detail-card">

          <div
            class="eyebrow"
            data-i18n="game.homeRunsEyebrow"
          >
            HOME RUNS
          </div>

          <h2 data-i18n="game.homeRuns">
            ホームラン
          </h2>


          <div
            id="homeRuns"
            class="result-list"
          ></div>

        </div>

      </div>

    </section>


    <!-- ===================================================
         GAME NOTES
         =================================================== -->

    <section
      class="section"
      id="notesSection"
      hidden
    >

      <div class="detail-card">

        <div
          class="eyebrow"
          data-i18n="game.notesEyebrow"
        >
          GAME NOTES
        </div>

        <h2 data-i18n="game.notes">
          試合メモ
        </h2>

        <p id="gameNotes"></p>

      </div>

    </section>


    <!-- ===================================================
         NOT FOUND
         =================================================== -->

    <section
      class="section game-error"
      id="gameNotFound"
      hidden
    >

      <div class="detail-card">

        <h2 data-i18n="game.notFound">
          試合が見つかりません
        </h2>

        <p data-i18n="game.notFoundDescription">
          指定された試合は存在しません。
        </p>

        <a
          href="./index.html#games"
          class="primary-button"
          data-i18n="game.return"
        >
          試合情報へ戻る
        </a>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <div>
      <strong>
        AHBA
      </strong>

      Asia HCBB Baseball Alliance
    </div>

    <div>
      <span data-i18n="footer.copyright">
        © Asia HCBB Baseball Alliance
      </span>
    </div>

  </footer>


  <script src="data.js"></script>
  <script src="game.js"></script>

</body>

</html>
