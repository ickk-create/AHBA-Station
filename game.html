<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Game | Asia HCBB Baseball Alliance
  </title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">

</head>


<body>

<header class="site-header">

  <div class="header-inner">

    <a href="index.html" class="brand">

      <span class="brand-main">
        ASIA HCBB
      </span>

      <span class="brand-sub">
        BASEBALL ALLIANCE
      </span>

    </a>


    <nav class="main-nav">

      <a
        href="index.html"
        data-i18n="nav.home"
      >
        ホーム
      </a>

      <a
        href="index.html#matches"
        data-i18n="nav.matches"
      >
        試合情報
      </a>

      <a
        href="index.html#standings"
        data-i18n="nav.standings"
      >
        順位表
      </a>

      <a
        href="index.html#schedule"
        data-i18n="nav.schedule"
      >
        日程
      </a>

      <a
        href="index.html#leagues"
        data-i18n="nav.leagues"
      >
        リーグ紹介
      </a>

    </nav>


    <div class="language-switcher">

      <button data-lang="ja">
        JP
      </button>

      <button data-lang="ko">
        KR
      </button>

      <button data-lang="zh">
        中文
      </button>
      
      <button data-lang="en">
        EN
      </button>

    </div>

  </div>

</header>



<main>

  <!-- =====================================================
       HERO
       ===================================================== -->

  <section class="game-hero">

    <div class="game-hero-inner">

      <a
        href="index.html#matches"
        class="back-link"
        data-i18n="game.back"
      >
        ← 試合情報へ戻る
      </a>


      <div
        class="game-type"
        id="gameType"
      >
        MATCH
      </div>


      <div
        class="eyebrow"
        data-i18n="game.eyebrow"
      >
        GAME DETAILS
      </div>


      <div
        class="game-date"
        id="gameDate"
      >
        --
      </div>


      <div class="final-score">

        <div
          class="final-team"
          id="homeTeam"
        >
          --
        </div>


        <div class="final-score-number">

          <strong id="homeScore">
            -
          </strong>

          <span>
            –
          </span>

          <strong id="awayScore">
            -
          </strong>

        </div>


        <div
          class="final-team"
          id="awayTeam"
        >
          --
        </div>

      </div>


      <div
        class="game-status-label"
        id="gameStatus"
      >
        --
      </div>

    </div>

  </section>



  <!-- =====================================================
       SCOREBOARD
       ===================================================== -->

  <section class="section">

    <div class="section-header">

      <div>

        <div
          class="eyebrow"
          data-i18n="game.scoreboardEyebrow"
        >
          SCOREBOARD
        </div>

        <h2 data-i18n="game.scoreboard">
          スコアボード
        </h2>

      </div>

    </div>


    <div class="scoreboard-wrap">

      <table
        class="scoreboard"
        id="scoreboard"
      >

        <thead></thead>

        <tbody></tbody>

      </table>

    </div>

  </section>



  <!-- =====================================================
       PITCHING / HOME RUNS
       ===================================================== -->

  <section class="section">

    <div class="detail-grid">


      <!-- 投手 -->

      <div class="detail-card">

        <div
          class="eyebrow"
          data-i18n="game.pitchingEyebrow"
        >
          PITCHING
        </div>

        <h2 data-i18n="game.pitching">
          投手成績
        </h2>


        <div
          id="pitchingResults"
          class="result-list"
        ></div>

      </div>



      <!-- ホームラン -->

      <div class="detail-card">

        <div
          class="eyebrow"
          data-i18n="game.homeRunsEyebrow"
        >
          HOME RUNS
        </div>

        <h2 data-i18n="game.homeRuns">
          ホームラン
        </h2>


        <div
          id="homeRuns"
          class="result-list"
        ></div>

      </div>

    </div>

  </section>



  <!-- =====================================================
       GAME NOTES
       ===================================================== -->

  <section
    class="section"
    id="notesSection"
    hidden
  >

    <div class="detail-card">

      <div
        class="eyebrow"
        data-i18n="game.notesEyebrow"
      >
        GAME NOTES
      </div>

      <h2 data-i18n="game.notes">
        試合メモ
      </h2>


      <p id="gameNotes"></p>

    </div>

  </section>



  <!-- =====================================================
       NOT FOUND
       ===================================================== -->

  <section
    class="section game-error"
    id="gameNotFound"
    hidden
  >

    <div class="detail-card">

      <h2 data-i18n="game.notFound">
        試合が見つかりません
      </h2>

      <p data-i18n="game.notFoundDescription">
        指定された試合は存在しません。
      </p>

      <a
        href="index.html#matches"
        class="primary-button"
        data-i18n="game.return"
      >
        試合情報へ戻る
      </a>

    </div>

  </section>

</main>



<footer class="site-footer">

  <div>
    <strong>
      ASIA HCBB BASEBALL ALLIANCE
    </strong>
  </div>

  <div>
    All Rights Reserved.
  </div>

</footer>



<script src="data.js"></script>
<script src="game.js"></script>

</body>

</html>
