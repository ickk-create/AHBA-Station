<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Game | Asia HCBB Baseball Alliance</title>

  <meta
    name="description"
    content="Asia HCBB Baseball Alliance Official Game Detail"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">
  
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header class="site-header">

    <div class="header-inner">

      <!-- Brand -->
      <a
        href="./index.html"
        class="site-brand"
      >
        <span class="site-brand-main">
          AHBA
        </span>

        <span class="site-brand-sub">
          Asia HCBB Baseball Alliance
        </span>
      </a>


      <!-- Navigation -->
      <nav class="main-nav">

        <a
          href="./index.html#games"
          data-i18n="nav.games"
        >
          試合結果
        </a>

        <a
          href="./index.html#standings"
          data-i18n="nav.standings"
        >
          順位表
        </a>

        <a
          href="./index.html#schedule"
          data-i18n="nav.schedule"
        >
          試合日程
        </a>

        <a
          href="./index.html#leagues"
          data-i18n="nav.leagues"
        >
          参加リーグ
        </a>

        <a
          href="./index.html#about"
          data-i18n="nav.about"
        >
          AHBAについて
        </a>

      </nav>


      <!-- Header Right -->
      <div class="header-right">

        <!-- Clock -->
        <div class="header-clock">

          <div id="clock">
            --:--:--
          </div>

          <div id="tz">
            Asia/Tokyo
          </div>

        </div>


        <!-- Language -->
        <div class="header-language">

          <button
            type="button"
            data-lang="ja"
            class="active"
          >
            JA
          </button>

          <button
            type="button"
            data-lang="ko"
          >
            KO
          </button>

          <button
            type="button"
            data-lang="en"
          >
            EN
          </button>

          <button
            type="button"
            data-lang="zh"
          >
            ZH
          </button>

        </div>

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->
  <main class="game-page">

    <!-- Back -->
    <div class="game-page-top">

      <a
        href="./index.html#games"
        id="backLink"
        class="back-link"
        data-i18n="game.back"
      >
        ← 試合一覧へ戻る
      </a>

    </div>


    <!-- =========================
         GAME HEADER
    ========================== -->
    <section class="game-header-section">

      <div class="game-header-inner">

        <!-- Event -->
        <div
          id="gameEvent"
          class="game-event"
        >
          —
        </div>


        <!-- Round -->
        <div
          id="gameRound"
          class="game-round"
        >
          —
        </div>


        <!-- Date -->
        <div
          id="gameDate"
          class="game-date"
        >
          —
        </div>


        <!-- Status -->
        <div
          id="gameStatus"
          class="game-status"
        >
          —
        </div>

      </div>

    </section>


    <!-- =========================
         SCOREBOARD
    ========================== -->
    <section class="game-score-section">

      <div class="game-scoreboard">

        <!-- Away -->
        <div class="game-team game-team-away">

          <div
            id="awayTeam"
            class="game-team-name"
          >
            —
          </div>

          <div
            id="awayScore"
            class="game-score"
          >
            —
          </div>

        </div>


        <!-- VS -->
        <div class="game-vs">

          <span data-i18n="game.vs">
            VS
          </span>

        </div>


        <!-- Home -->
        <div class="game-team game-team-home">

          <div
            id="homeTeam"
            class="game-team-name"
          >
            —
          </div>

          <div
            id="homeScore"
            class="game-score"
          >
            —
          </div>

        </div>

      </div>

    </section>


    <!-- =========================
         INNING SCORE
    ========================== -->
    <section class="game-detail-section">

      <div class="game-section-heading">

        <span class="section-label">
          SCORE
        </span>

        <h2 data-i18n="game.score">
          イニングスコア
        </h2>

      </div>


      <div class="table-wrapper">

        <table class="game-innings-table">

          <thead>

            <tr id="inningHeader">

              <th>
                TEAM
              </th>

            </tr>

          </thead>


          <tbody>

            <tr id="awayInnings">

              <th>
                —
              </th>

            </tr>


            <tr id="homeInnings">

              <th>
                —
              </th>

            </tr>

          </tbody>

        </table>

      </div>

    </section>


    <!-- =========================
         PITCHING
    ========================== -->
    <section class="game-detail-section">

      <div class="game-section-heading">

        <span class="section-label">
          PITCHING
        </span>

        <h2 data-i18n="game.pitching">
          投手成績
        </h2>

      </div>


      <div class="table-wrapper">

        <table class="game-pitching-table">

          <thead>

            <tr>

              <th data-i18n="game.pitchingResult">
                結果
              </th>

              <th data-i18n="game.pitcher">
                投手
              </th>

            </tr>

          </thead>


          <tbody id="pitchingBody">

            <tr>

              <td colspan="2">
                —
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>


    <!-- =========================
         NOTES
    ========================== -->
    <section class="game-detail-section">

      <div class="game-section-heading">

        <span class="section-label">
          NOTES
        </span>

        <h2 data-i18n="game.notes">
          試合メモ
        </h2>

      </div>


      <div
        id="gameNotes"
        class="game-notes"
      >
        —
      </div>

    </section>


    <!-- =========================
         FOOTER NAVIGATION
    ========================== -->
    <section class="game-footer-navigation">

      <a
        href="./index.html#games"
        class="game-back-button"
        data-i18n="game.back"
      >
        ← 試合一覧へ戻る
      </a>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->
  <footer class="site-footer">

    <div class="footer-inner">

      <div class="footer-brand">

        <strong>
          AHBA
        </strong>

        <span>
          Asia HCBB Baseball Alliance
        </span>

      </div>


      <div class="footer-links">

        <a
          href="./index.html#games"
          data-i18n="nav.games"
        >
          試合結果
        </a>

        <a
          href="./index.html#standings"
          data-i18n="nav.standings"
        >
          順位表
        </a>

        <a
          href="./index.html#schedule"
          data-i18n="nav.schedule"
        >
          試合日程
        </a>

        <a
          href="./index.html#leagues"
          data-i18n="nav.leagues"
        >
          参加リーグ
        </a>

      </div>


      <div class="footer-copy">
        © Asia HCBB Baseball Alliance
      </div>

    </div>

  </footer>


  <!-- =========================
       SCRIPTS
  ========================== -->

  <!-- Data must load first -->
  <script src="./data.js"></script>

  <!-- Game detail logic -->
  <script src="./game.js"></script>

</body>
</html>
